<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Internet Banking - Sign Out</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


<div class="logout-page">


    <div class="logout-card">


        <!-- BRAND -->

        <div class="logout-brand">


            <div class="logout-logo">
                ◆
            </div>


            <div>

                <strong>
                    INTERNET
                </strong>

                <span>
                    BANKING
                </span>

            </div>


        </div>



        <!-- ICON -->

        <div class="logout-success-icon">

            ✓

        </div>



        <p class="bank-eyebrow">

            SESSION

        </p>


        <h1>
            You have been signed out
        </h1>


        <p class="logout-description">

            Your current session has been closed.
            You can sign in again whenever you are ready.

        </p>



        <!-- ACCOUNT -->

        <div class="logout-account">


            <div>

                <span>
                    Account Holder
                </span>

                <strong>
                    Sandra Conner
                </strong>

            </div>


            <div>

                <span>
                    Account
                </span>

                <strong>
                    USD •••• 4821
                </strong>

            </div>


        </div>



        <!-- BUTTON -->

        <a
            href="index.html"
            class="bank-primary-button logout-button">

            Return to Sign In

            <span>
                →
            </span>

        </a>



        <div class="logout-footer">

            <span>
                Internet Banking
            </span>

            <span>
                Secure Session
            </span>

        </div>


    </div>


</div>


</body>

</html>
